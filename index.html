<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trockenbau-Assistent</title>
<style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#f97316;--text:#e0e0e0;--muted:#8892a4;--border:#2a2a4a;--green:#4caf50;--red:#e74c3c;--purple:#9b59b6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
header{background:var(--card);border-bottom:2px solid var(--accent);padding:12px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;color:var(--accent)}
.container{max-width:1100px;margin:0 auto;padding:20px}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;cursor:pointer;transition:all .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card.active{border-color:var(--accent);box-shadow:0 0 20px rgba(249,115,22,0.15)}
.card h3{font-size:16px;margin-bottom:6px}
.card .dims{font-size:13px;color:var(--muted);margin-bottom:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin:4px 2px}
.badge.door{background:var(--accent);color:#fff}
.badge.nodoor{background:var(--green);color:#fff}
.badge.wheelchair{background:var(--purple);color:#fff}
.detail{display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:24px}
.detail.active{display:block}
.step-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.step-btn{padding:8px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text);cursor:pointer;font-size:12px;transition:all .2s}
.step-btn:hover{border-color:var(--accent)}
.step-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.step-btn.done{background:var(--green);color:#fff;border-color:var(--green)}
.step-content{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
h2{font-size:20px;color:var(--accent);margin-bottom:16px}
h4{font-size:15px;margin:12px 0 6px;color:var(--accent)}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
th{background:var(--bg);color:var(--accent);padding:8px 10px;text-align:left;font-size:11px}
td{padding:7px 10px;border-bottom:1px solid var(--border)}
tr:nth-child(even) td{background:rgba(255,255,255,0.02)}
.svg-container{background:#fff;border-radius:8px;padding:16px;margin:12px 0;text-align:center;overflow-x:auto}
.note{background:rgba(249,115,22,0.1);border-left:3px solid var(--accent);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:12px}
.warning{background:rgba(231,76,60,0.1);border-left:3px solid var(--red);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:12px}
.tip{background:rgba(76,175,80,0.1);border-left:3px solid var(--green);padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:12px}
.progress{display:flex;gap:4px;margin:8px 0}
.progress-dot{width:24px;height:4px;background:var(--border);border-radius:2px}
.progress-dot.filled{background:var(--accent)}
</style>
</head>
<body>
<header><h1>🏗️ Trockenbau-Assistent</h1><span>Schritt-für-Schritt · 3 Wände</span></header>
<div class="container">
<div class="dashboard">
<div class="card active" id="card-wall1" onclick="SEL('wall1')"><h3>🅰️ Wand 1 — Büro</h3><div class="dims">4,25×3,00 m</div><span class="badge door">🚪 Standard-Tür 875×2110</span><div class="progress" id="prog1"></div></div>
<div class="card" id="card-wall2" onclick="SEL('wall2')"><h3>🅱️ Wand 2 — Ohne Tür</h3><div class="dims">1,98×3,00 m</div><span class="badge nodoor">Keine Tür</span><div class="progress" id="prog2"></div></div>
<div class="card" id="card-wall3" onclick="SEL('wall3')"><h3>🅲 Wand 3 — Rollstuhl ♿</h3><div class="dims">2,18×3,00 m</div><span class="badge wheelchair">♿ DIN 18040 · 985×2100</span><div class="progress" id="prog3"></div></div>
</div>
<div class="detail active" id="detail-wall1"></div>
<div class="detail" id="detail-wall2"></div>
<div class="detail" id="detail-wall3"></div>
</div>
<script>
var WALLS={
wall1:{title:'Wand 1 — Büro (links)',width:425,door:{type:'standard',leafW:87.5,leafH:211,roughW:91,roughH:213,label:'Standard-Zimmertür 875×2110 mm'},steps:['plan','mark','uw','door','cw','insul','clad','finish']},
wall2:{title:'Wand 2 — Ohne Tür',width:198,door:null,steps:['plan','mark','uw','cw','insul','clad','finish']},
wall3:{title:'Wand 3 — Rollstuhlgerecht ♿',width:218,door:{type:'wheelchair',leafW:98.5,leafH:210,roughW:102,roughH:213,label:'Rollstuhlgerechte Tür 985×2100 mm (DIN 18040)'},steps:['plan','mark','uw','door','cw','insul','clad','finish']}
};
var cur='wall1',cstep={},COLORS={wall1:'#f97316',wall2:'#4caf50',wall3:'#9b59b6'};
function n(id){return COLORS[id]||'#f97316'}

function SEL(id){cur=id;document.querySelectorAll('.card').forEach(function(c){c.classList.remove('active')});document.getElementById('card-'+id).classList.add('active');document.querySelectorAll('.detail').forEach(function(d){d.classList.remove('active')});document.getElementById('detail-'+id).classList.add('active');if(!(id in cstep))cstep[id]=0;RENDER(id)}
function SET(id,i){cstep[id]=i;RENDER(id)}

// SVG generators — dynamic, wall-aware
function genSVG(id,step,w){
var d=w.door,W2=w.width,clr=n(id),wcm=(W2/100).toFixed(2);
function planS(){var s='<svg width="540" height="160" viewBox="0 0 540 160"><rect fill="#fff" width="540" height="160"/>';s+='<text x="20" y="20" font-size="12" font-weight="bold" fill="#1a1a2e">Planung: '+wcm+'m × 3,00m · '+(!d?'Keine Tür':d.label)+'</text>';if(d){var lft=(W2-d.roughW)/2,rht=lft+d.roughW;s+='<rect x="'+(20+lft)+'" y="40" width="'+d.roughW+'" height="90" fill="'+(d.type==='wheelchair'?'#e8d5f5':'#e8f5e9')+'" stroke="'+clr+'" stroke-width="2" rx="2"/>';s+='<text x="'+(25+d.roughW/2+lft)+'" y="82" text-anchor="middle" font-size="9" fill="'+clr+'" font-weight="bold">TÜR</text>';s+='<text x="'+(25+d.roughW/2+lft)+'" y="96" text-anchor="middle" font-size="7" fill="'+clr+'">'+d.roughW+'×'+d.roughH+' cm Rohbau</text>';if(d.type==='wheelchair')s+='<text x="'+(25+d.roughW/2+lft)+'" y="122" text-anchor="middle" font-size="6" fill="'+clr+'">♿ DIN 18040 Zwang</text>';}else{s+='<text x="260" y="80" text-anchor="middle" font-size="11" fill="#4caf50">Keine Tür — schnellster Aufbau</text>';}s+='<text x="20" y="148" font-size="8" fill="#666">Leitungssucher vor Bohrbeginn!</text>';s+='</svg>';return s}
function markS(){var s='<svg width="540" height="180" viewBox="0 0 540 180"><rect fill="#fff" width="540" height="180"/>';s+='<text x="20" y="18" font-size="11" font-weight="bold" fill="#1a1a2e">Riss anzeichnen — '+wcm+' m</text>';s+='<rect x="20" y="155" width="500" height="10" fill="#ddd" rx="2"/><text x="270" y="163" text-anchor="middle" font-size="7" fill="#666">BODEN</text>';s+='<rect x="20" y="28" width="500" height="10" fill="#ddd" rx="2"/><text x="270" y="36" text-anchor="middle" font-size="7" fill="#666">DECKE</text>';s+='<rect x="242" y="40" width="20" height="14" fill="'+clr+'" rx="2"/><text x="252" y="50" text-anchor="middle" font-size="6" fill="#fff">LASER</text>';s+='<line x1="252" y1="54" x2="252" y2="153" stroke="'+clr+'" stroke-width="1" stroke-dasharray="4,4"/>';s+='<line x1="80" y1="160" x2="420" y2="160" stroke="#1a1a2e" stroke-width="2"/><line x1="80" y1="33" x2="420" y2="33" stroke="#1a1a2e" stroke-width="2"/>';s+='<text x="80" y="175" font-size="7">Boden-Linie '+wcm+' m</text>';if(d){var lft=(W2-d.roughW)/2;s+='<rect x="'+(200+lft*0.4)+'" y="50" width="12" height="100" fill="'+clr+'" opacity="0.2"/>';s+='<rect x="'+(200+(lft+d.roughW)*0.4)+'" y="50" width="12" height="100" fill="'+clr+'" opacity="0.2"/>';s+='<text x="252" y="115" text-anchor="middle" font-size="7" fill="'+clr+'">Tür '+d.roughW+' cm</text>';}s+='<text x="440" y="80" font-size="7" fill="#666">✓ Laser-Flucht</text><text x="440" y="95" font-size="7" fill="#666">✓ Diagonalmaß</text>';s+='</svg>';return s}
function uwS(){var s='<svg width="540" height="160" viewBox="0 0 540 160"><rect fill="#fff" width="540" height="160"/>';s+='<text x="20" y="18" font-size="11" font-weight="bold" fill="#1a1a2e">UW-Profile montieren — '+wcm+' m</text>';s+='<rect x="20" y="135" width="500" height="10" fill="#ddd" rx="2"/><rect x="20" y="25" width="500" height="10" fill="#ddd" rx="2"/>';s+='<rect x="50" y="36" width="440" height="8" fill="#1a1a2e" rx="1"/><text x="270" y="43" text-anchor="middle" font-size="7" fill="'+clr+'">UW-Decke '+wcm+' m (durchgehend)</text>';s+='<rect x="45" y="34" width="450" height="3" fill="#e74c3c" opacity="0.6"/><text x="500" y="36" font-size="6" fill="#e74c3c">Randdichtband</text>';if(d){var lft=(W2-d.roughW)/2;s+='<rect x="50" y="128" width="'+Math.round(lft)+ '" height="8" fill="#1a1a2e" rx="1"/><text x="'+(55+Math.round(lft)/2)+'" y="136" text-anchor="middle" font-size="6" fill="'+clr+'">'+(lft/100).toFixed(2)+'m</text>';s+='<rect x="'+(50+Math.round(lft+d.roughW))+'" y="128" width="'+Math.round(W2-lft-d.roughW)+'" height="8" fill="#1a1a2e" rx="1"/>';s+='<rect x="'+(50+Math.round(lft)) +'" y="128" width="'+d.roughW+'" height="8" fill="none" stroke="'+clr+'" stroke-dasharray="4,2"/>';s+='<text x="'+(55+Math.round(lft+d.roughW/2))+'" y="148" text-anchor="middle" font-size="7" fill="'+clr+'">TÜR-LÜCKE '+d.roughW+' cm</text>';}else{s+='<rect x="50" y="128" width="440" height="8" fill="#1a1a2e" rx="1"/><text x="270" y="136" text-anchor="middle" font-size="7" fill="'+clr+'">UW-Boden '+wcm+' m</text>';}s+='</svg>';return s}
function doorS(){if(!d)return'<svg width="540" height="100" viewBox="0 0 540 100"><rect fill="#fff" width="540" height="100"/><text x="20" y="50" font-size="12" fill="#666">Keine Tür — dieser Schritt entfällt ✓</text></svg>';var cn=d.type==='wheelchair'?'#9b59b6':'#f97316';var s='<svg width="540" height="260" viewBox="0 0 540 260"><rect fill="#fff" width="540" height="260"/>';s+='<text x="20" y="18" font-size="11" font-weight="bold" fill="#1a1a2e">Türrahmen'+(d.type==='wheelchair'?' — UA-Profile, rollstuhlgerecht ♿':'')+'</text>';s+='<rect x="20" y="240" width="500" height="12" fill="#ddd" rx="2"/><rect x="20" y="25" width="500" height="12" fill="#ddd" rx="2"/>';s+='<rect x="180" y="120" width="180" height="14" fill="'+cn+'" rx="1"/><text x="270" y="131" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">TÜRSTURZ ('+d.roughH+' cm Höhe)</text>';s+='<rect x="180" y="120" width="'+(d.type==='wheelchair'?8:6)+'" height="115" fill="'+cn+'" rx="1"/>';s+='<rect x="'+(360-(d.type==='wheelchair'?8:6))+'" y="120" width="'+(d.type==='wheelchair'?8:6)+'" height="115" fill="'+cn+'" rx="1"/>';s+='<text x="160" y="185" text-anchor="end" font-size="7" fill="'+cn+'">Türpfosten</text><text x="388" y="185" font-size="7" fill="'+cn+'">Türpfosten</text>';s+='<rect x="180" y="128" width="180" height="106" fill="'+(d.type==='wheelchair'?'#e8d5f5':'#e8f5e9')+'" stroke="'+cn+'" stroke-width="1.5" rx="3"/>';s+='<text x="270" y="185" text-anchor="middle" font-size="9" fill="'+cn+'" font-weight="bold">'+(d.type==='wheelchair'?'♿ ':'')+'TÜR</text>';s+='<text x="270" y="200" text-anchor="middle" font-size="7" fill="'+cn+'">'+d.leafW+'×'+d.leafH+' mm</text>';s+='<rect x="174" y="120" width="192" height="115" fill="none" stroke="#1a1a2e" stroke-width="2" rx="3"/>';if(d.type==='wheelchair'){s+='<line x1="180" y1="215" x2="360" y2="215" stroke="#999" stroke-dasharray="2,2"/>';s+='<text x="270" y="212" text-anchor="middle" font-size="7">0-mm-Schwelle ♿</text>';}s+='<line x1="170" y1="120" x2="170" y2="235" stroke="#999" stroke-dasharray="2,2"/><text x="165" y="180" text-anchor="end" font-size="7">'+d.roughH+' cm</text>';s+='</svg>';return s}
function cwS(){var nSt=Math.ceil(W2/62.5),s='<svg width="540" height="140" viewBox="0 0 540 140"><rect fill="#fff" width="540" height="140"/>';s+='<text x="20" y="18" font-size="11" font-weight="bold" fill="#1a1a2e">CW-Ständer — 62,5 cm Raster ('+nSt+' Profile)</text>';for(var i=0,px=30;i<=nSt;i++){if(px>520)break;var isD=false;if(d){var lft=Math.round((W2-d.roughW)/2-15),rht=lft+d.roughW+30;if(px>=30+lft*480/W2&&px<=30+rht*480/W2)isD=true;}s+='<rect x="'+px+'" y="30" width="'+(isD?7:5)+'" height="95" fill="'+(isD?clr:'#555')+'" rx="1"/>';if(isD)s+='<text x="'+(px+4)+'" y="55" font-size="5" fill="#fff">Pfosten</text>';else s+='<text x="'+(px+3)+'" y="80" font-size="5" fill="#888" transform="rotate(-90 '+(px+3)+' 80)">CW</text>';px+=Math.max((480/Math.max(nSt+1,1)),45)}s+='</svg>';return s}
function insulS(){var nG=Math.max(Math.ceil(W2/62.5),2),s='<svg width="540" height="120" viewBox="0 0 540 120"><rect fill="#fff" width="540" height="120"/>';s+='<text x="20" y="18" font-size="11" font-weight="bold" fill="#1a1a2e">Dämmung: Mineralwolle 60 mm</text>';for(var i=0;i<nG;i++){s+='<rect x="'+(30+i*82)+'" y="28" width="75" height="80" fill="#ffcc00" opacity="0.3" rx="1"/>'}s+='<text x="260" y="75" text-anchor="middle" font-size="8" fill="#b8860b">'+nG+' Gefache · lückenlos einlegen</text>';s+='</svg>';return s}
function cladS(){var s='<svg width="540" height="150" viewBox="0 0 540 150"><rect fill="#fff" width="540" height="150"/>';s+='<text x="20" y="18" font-size="11" font-weight="bold" fill="#1a1a2e">Beplankung — Einlagig (12,5 mm GK)</text>';if(d){var lft=Math.round((W2-d.roughW)/2),rht=W2-lft-d.roughW;s+='<rect x="30" y="30" width="'+lft+'" height="45" fill="#eee" stroke="#999" rx="2"/><text x="'+(30+lft/2)+'" y="56" text-anchor="middle" font-size="7" fill="#666">GK '+lft+' cm</text>';s+='<rect x="30" y="78" width="'+lft+'" height="45" fill="#eee" stroke="#999" rx="2"/>';s+='<rect x="'+(35+lft)+'" y="30" width="'+d.roughW+'" height="55" fill="none" stroke="'+clr+'" stroke-dasharray="3,2" rx="1"/><text x="'+(35+lft+d.roughW/2)+'" y="60" text-anchor="middle" font-size="6" fill="'+clr+'">TÜR</text>';s+='<rect x="'+(35+lft+d.roughW)+'" y="30" width="'+rht+'" height="45" fill="#eee" stroke="#999" rx="2"/><text x="'+(35+lft+d.roughW+rht/2)+'" y="56" text-anchor="middle" font-size="7" fill="#666">GK '+rht+' cm</text>';s+='<rect x="'+(35+lft)+'" y="78" width="'+d.roughW+'" height="45" fill="#eee" stroke="#999" rx="2"/><text x="'+(35+lft+d.roughW/2)+'" y="104" text-anchor="middle" font-size="6" fill="#666">Rest über Tür</text>';}else{var pl=Math.ceil(W2/125);for(var i=0;i<pl;i++){var pw=Math.min(125,W2-i*125);s+='<rect x="'+(40+i*90)+'" y="35" width="'+pw+'" height="90" fill="#eee" stroke="#999" rx="2"/>';s+='<text x="'+(40+i*90+pw/2)+'" y="85" text-anchor="middle" font-size="7" fill="#666">GK '+pw+' cm</text>';}}s+='<text x="30" y="140" font-size="8" fill="#e74c3c">10 mm Bodenfreiheit | TN 25 mm | 25 cm Schraubabstand</text>';if(d&&d.type==='wheelchair')s+='<text x="360" y="140" font-size="8" fill="#9b59b6">♿ Türbereich: 0 mm!</text>';s+='</svg>';return s}
function finishS(){var s='<svg width="540" height="140" viewBox="0 0 540 140"><rect fill="#fff" width="540" height="140"/>';s+='<text x="20" y="18" font-size="11" font-weight="bold" fill="#1a1a2e">Verspachteln & Finish</text>';s+='<rect x="40" y="30" width="180" height="95" fill="#eee" stroke="#999" rx="2"/>';s+='<line x1="130" y1="30" x2="130" y2="125" stroke="#4caf50" stroke-width="3" opacity="0.5"/><text x="135" y="82" font-size="6" fill="#4caf50">Fugenband</text>';s+='<circle cx="70" cy="50" r="3" fill="#ccc"/><circle cx="90" cy="60" r="3" fill="#ccc"/><circle cx="160" cy="70" r="3" fill="#ccc"/>';s+='<text x="240" y="40" font-size="9">1. Fugenband in Spachtelbett</text>';s+='<text x="240" y="55" font-size="9">2. Schraubenköpfe spachteln</text>';s+='<text x="240" y="70" font-size="9">3. 1. Gang (Q2) → 24h trocknen</text>';s+='<text x="240" y="85" font-size="9">4. 2. Gang (Feinspachtel) → 12h</text>';s+='<text x="240" y="100" font-size="9">5. Schleifen (120er, Staubmaske)</text>';s+='<text x="240" y="115" font-size="9">6. Tiefengrund → Streichen</text>';s+='<text x="240" y="130" font-size="9" fill="'+clr+'">'+(d?'7. Türzarge einbauen (24h Schaum)':'✅ Fertig!')+'</text>';s+='</svg>';return s}
var map={plan:planS,mark:markS,uw:uwS,door:doorS,cw:cwS,insul:insulS,clad:cladS,finish:finishS};
var fn=map[step];
return fn?fn():'<svg width="540" height="80"><rect fill="#fff" width="540" height="80"/><text x="20" y="45" font-size="12" fill="#666">📐 '+step+'</text></svg>'
}

// Step content generators
function stepC(step,w,d){
var wm=(w.width/100).toFixed(2),m2=((w.width*300)/10000).toFixed(2);
switch(step){
case'plan':return'<p><strong>Raummaße:</strong> '+wm+' × 3,00 m = <strong>'+m2+' m²</strong>.</p>'+(d?'<p><strong>Tür:</strong> '+d.label+'<br>Rohbaumaß: <strong>'+d.roughW+'×'+d.roughH+' cm</strong>.'+(d.type==='wheelchair'?'</p><div class="note"><strong>♿ DIN 18040:</strong> Lichte Breite ≥900 mm, Höhe ≥2050 mm, max. 25 N Öffnungskraft, 0-mm-Bodenschwelle, Bewegungsfläche ≥150×150 cm.</div>':'</p>'):'<p>Keine Tür — einfachster Wandtyp.</p>')+'<p>⚠️ Vor Bohrbeginn: Leitungssucher verwenden!</p>';
case'mark':return'<p>1. <strong>Laser aufstellen.</strong> Vertikale Flucht auf Wandposition ausrichten.</p><p>2. <strong>Bodenlinie: '+wm+' m</strong> exakt anzeichnen.</p><p>3. Mit Lot/Laser auf Decke übertragen.</p>'+(d?'<p>4. <strong>Türposition</strong> markieren: Öffnung '+d.roughW+' cm breit.</p>':'')+'<p>5. Seitenwand-Anschlüsse senkrecht anzeichnen.</p><p>6. <strong>Diagonalmaße prüfen</strong> — max. 5 mm Abweichung!</p>';
case'uw':return'<p>1. <strong>Randdichtband (Trennfix)</strong> auf UW-Profile kleben.</p>'+(d?'<p>2. <strong>UW-Boden:</strong> Türbereich ('+d.roughW+' cm) aussparen → <strong>2 separate Stücke</strong>.</p>':'<p>2. <strong>UW-Boden:</strong> '+wm+' m, <strong>1 Stück</strong>.</p>')+'<p>3. <strong>UW-Decke:</strong> Durchgehend '+wm+' m. Schlagdübel Ø6 mm alle 50–80 cm.</p><p>4. CW-Wandanschlüsse links + rechts an bestehende Wände dübeln.</p>'+(d&&d.type==='wheelchair'?'<div class="note">♿ UW-Boden im Türbereich nach Beplankung bündig abschneiden (schwellenloser Durchgang).</div>':'');
case'door':if(!d)return'<p>Keine Tür — dieser Schritt entfällt. ✓</p>';return'<p><strong>Türpfosten:</strong> Je <strong>2 '+(d.type==='wheelchair'?'UA-Profile (2 mm Wandstärke)':'CW-Profile')+' Rücken an Rücken</strong>. Mit UW-Boden kraftschlüssig verschrauben.</p><p><strong>Türsturz:</strong> '+(d.type==='wheelchair'?'UA-Profil (2 mm) oder Holz 80×80 mm':'UA-Profil oder Holz 80×40 mm')+' auf <strong>'+d.roughH+' cm Höhe</strong> setzen. Exakt waagerecht (Wasserwaage beide Richtungen).</p><p><strong>Aussteifung über Sturz:</strong> Kurze CW-Stücke zwischen Sturz und UW-Decke (alle 62,5 cm).</p>'+(d.type==='wheelchair'?'<div class="note"><strong>♿ Zusätzlich:</strong> Verstärkte UA-Profile für optionale Türschließer-Halterung vorsehen. Schwellenlose Zarge bestellen.</div>':'');
case'cw':var html='<p><strong>Raster: 62,5 cm</strong> (Mitte zu Mitte). CW-Profile 10 mm kürzer als Raumhöhe ablängen. In UW stecken — <strong>NICHT verschrauben</strong> (Dehnungsfuge)!</p><table><tr><th>#</th><th>Typ</th><th>Position</th></tr>',i=1,pos=0;if(d){var tLft=Math.round((w.width-d.roughW)/2-15),tRht=tLft+d.roughW+30,doneLR=false;while(pos<=w.width+5){if(!doneLR&&pos>=tLft-10&&pos<=tLft+10){html+='<tr><td>'+(i++)+'</td><td style="color:'+n(cur)+';font-weight:bold">Türpfosten L (doppelt)</td><td>~'+tLft+' cm</td></tr>';html+='<tr><td>'+(i++)+'</td><td style="color:'+n(cur)+';font-weight:bold">Türpfosten R (doppelt)</td><td>~'+tRht+' cm</td></tr>';doneLR=true;pos=tRht+62.5;}else{if(pos<=w.width){html+='<tr><td>'+(i++)+'</td><td style="color:var(--muted)">CW</td><td>'+pos+' cm</td></tr>';}pos+=62.5;}if(pos>=w.width-5&&doneLR){html+='<tr><td>'+(i++)+'</td><td style="color:var(--muted)">CW (Wandanschluss)</td><td>'+w.width+' cm</td></tr>';break;}}}else{while(pos<=w.width){html+='<tr><td>'+(i++)+'</td><td style="color:var(--muted)">CW</td><td>'+pos+' cm</td></tr>';pos+=62.5;if(pos>=w.width-5&&pos<w.width+5){html+='<tr><td>'+(i++)+'</td><td style="color:var(--muted)">CW (Wandanschluss)</td><td>'+w.width+' cm</td></tr>';break;}}}return html+'</table><p>Öffnungen alle in dieselbe Richtung. <strong>10 mm kürzer</strong> als Decken-Boden-Maß.</p>';
case'insul':return'<p>Mineralwolle 60 mm in <strong>ALLE Gefache</strong> einlegen.</p><p>• Streifen ca. 1 cm breiter als Gefach zuschneiden (klemmt dann)</p><p>• Lückenlos einpassen — auch über dem Türsturz!</p><p>• 🧤 Schutzhandschuhe + 😷 Staubmaske tragen</p><p>• NICHT pressen/stopfen — Dämmwirkung verschlechtert sich</p>';
case'clad':var pl=Math.ceil(w.width/125),html2='<p><strong>Gipskarton 12,5 mm · 1250×3000 mm · '+pl+' Platten</strong></p><table><tr><th>Segment</th><th>Zuschnitt</th><th>Anz.</th></tr>';if(d){var lft=Math.round((w.width-d.roughW)/2),rht=w.width-lft-d.roughW;html2+='<tr><td>Links der Tür</td><td>'+lft+'×3000 mm</td><td>1</td></tr>';html2+='<tr><td>Rechts der Tür</td><td>'+rht+'×3000 mm</td><td>1</td></tr>';html2+='<tr><td>Über Türsturz</td><td>'+d.roughW+'×~'+(300-d.roughH)+' mm</td><td>1 (Reststück)</td></tr>';}else{for(var j=0;j<pl;j++){var pw=Math.min(125,w.width-j*125);html2+='<tr><td>Segment '+(j+1)+'</td><td>'+pw+'×3000 mm</td><td>1</td></tr>';}}html2+='</table><p><strong>Schrauben:</strong> TN 25 mm, alle <strong>25 cm</strong> auf Ständer (Randbereich 15 cm). Versenkt — <strong>Papier NICHT durchstoßen!</strong></p><p>Plattenstöße exakt auf CW-Mitte. 10 mm Bodenfreiheit'+(d&&d.type==='wheelchair'?' (<strong>♿ Türbereich: 0 mm!</strong>)':'')+'.</p>';return html2;
case'finish':return'<p>1. <strong>Fugenband</strong> in Spachtelbett einbetten (alle Plattenstöße).</p><p>2. <strong>Schraubenköpfe</strong> einzeln überspachteln.</p><p>3. <strong>1. Spachtelgang</strong> (Q2-Standard). → 24h trocknen.</p><p>4. <strong>Eckprofile</strong> an Außenecken'+(d?' und Türlaibung':'')+' setzen.</p><p>5. <strong>2. Spachtelgang</strong> (Feinspachtel). → 12h trocknen.</p><p>6. <strong>Schleifen</strong> mit 120er Schleifgitter (Staubmaske!).</p><p>7. <strong>Tiefengrund</strong> auftragen, trocknen lassen → Streichen/Tapezieren.</p>'+(d?'<p>8. <strong>Türzarge einsetzen:</strong> Mit Keilen + Zargenschaum fixieren. 24h aushärten → Tür einhängen.'+(d.type==='wheelchair'?'</p><div class="note"><strong>♿ Rollstuhlgerechte Zarge:</strong> Schwellenlos (0 mm). Türdrücker auf 85 cm Höhe. Öffnungskraft testen ≤25 N. Bewegungsfläche ≥150×150 cm vor und nach der Tür.</div>':'</p>'):'');
default:return'<p>Schritt wird geladen...</p>'
}}

// Step display data
var STEP_INFO={plan:{t:'Planung & Vermessung'},mark:{t:'Riss anzeichnen'},uw:{t:'UW-Profile montieren'},door:{t:'Türrahmen setzen'},cw:{t:'CW-Ständer setzen'},insul:{t:'Dämmung einlegen'},clad:{t:'Beplankung'},finish:{t:'Verspachteln & Finish'}};

function RENDER(id){
var w=WALLS[id],si=cstep[id]||0,d=w.door,steps=w.steps,el=document.getElementById('detail-'+id);
var nav='<div class="step-nav">';steps.forEach(function(s,i){var cls='step-btn';if(i===si)cls+=' active';if(i<si)cls+=' done';nav+='<button class="'+cls+'" onclick="SET(\''+id+'\','+i+')">'+(i+1)+'. '+STEP_INFO[s].t+'</button>'});nav+='</div>';
var prog='<div class="progress">'+steps.map(function(_,i){return'<div class="progress-dot'+(i<=si?' filled':'')+'"></div>'}).join('')+'</div>';
var content=stepC(steps[si],w,d),svg=genSVG(id,steps[si],w);
el.innerHTML='<h2>'+w.title+'</h2><p style="color:var(--muted)">'+(d?d.label:'Keine Tür')+' · Einlagige Metallständerwand · '+(w.width/100).toFixed(2)+'×3,00 m</p>'+prog+nav+'<div class="step-content"><h4>Schritt '+(si+1)+': '+STEP_INFO[steps[si]].t+'</h4><div class="svg-container">'+svg+'</div>'+content+'<div style="margin-top:16px;display:flex;gap:8px;">'+(si>0?'<button class="step-btn" onclick="SET(\''+id+'\','+(si-1)+')">← Zurück</button>':'')+(si<steps.length-1?'<button class="step-btn active" onclick="SET(\''+id+'\','+(si+1)+')">Weiter →</button>':'<span style="color:var(--green);padding:8px">✅ Alle Schritte abgeschlossen!</span>')+'</div></div>';
var pe=document.getElementById('prog'+id.slice(-1));if(pe)pe.innerHTML=steps.map(function(_,i){return'<div class="progress-dot'+(i<=si?' filled':'')+'"></div>'}).join('')
}

SEL('wall1');
</script>
